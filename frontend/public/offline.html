<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ไม่มีการเชื่อมต่ออินเตอร์เน็ต — Grand Line</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans Thai", system-ui, sans-serif;
      background: #f5f7fa;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      border-radius: 2rem;
      border: 1px solid #e5e7eb;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      padding: 48px 40px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .icon {
      width: 72px;
      height: 72px;
      background: #eef2ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }
    h1 { font-size: 1.25rem; font-weight: 800; color: #1b3168; }
    p  { font-size: 0.875rem; color: #6b7280; line-height: 1.6; }
    button {
      margin-top: 8px;
      padding: 12px 32px;
      border-radius: 9999px;
      background: #1b3168;
      color: #fff;
      font-weight: 700;
      font-size: 0.875rem;
      border: none;
      cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #12224f; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="36" height="36" fill="none" stroke="#1b3168" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M3 15a4 4 0 004 4h9a5 5 0 10-4.584-6.996A4.002 4.002 0 003 15z"/>
        <line x1="12" y1="10" x2="12" y2="10" stroke-width="3" stroke-linecap="round"/>
        <path stroke-linecap="round" d="M8.5 8.5L12 12l3.5-3.5"/>
      </svg>
    </div>
    <h1>ไม่มีการเชื่อมต่ออินเตอร์เน็ต</h1>
    <p>ดูเหมือนว่าคุณออฟไลน์อยู่<br/>หน้านี้ยังไม่ได้ถูกบันทึกในแคช<br/>กรุณาตรวจสอบการเชื่อมต่อแล้วลองใหม่</p>
    <button onclick="location.reload()">ลองอีกครั้ง</button>
  </div>
</body>
</html>
